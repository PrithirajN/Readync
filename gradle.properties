# Memory for the build. The app's Kotlin and R8 run inside Gradle's own process. 2 GB ran out
# compiling, and 6 GB with two jobs at once was more than the CI machine has (a private repo's
# runner has about 7 GB in all), so it was shut down. 4 GB, one job at a time, fits both.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
